<!DOCTYPE html>
<html lang="en">

<head>
	<title>Board Dashboard - Andresen Scholarships</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="robots" content="noindex" />
	<link rel="icon" type="image/svg+xml" href="favicon.svg" />
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="assets/css/site.css" />
</head>

<body class="admin-body">
	<a class="skip-link" href="#main">Skip to main content</a>


	<!-- Top bar -->
	<header class="admin-top">
		<div class="wrap">
			<a class="brand" href="admin.html">
								<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
					<!-- Barn & silo. Duplicated in every page's header and in favicon.svg -->
					<path d="M44.5 22c0-9 12-9 12 0v32h-12z" fill="#8fb072"/>
					<path d="M5 31.5L24 17l19 14.5v22.5H5z" fill="#f2eeda"/>
					<path d="M20 40h8v14h-8z" fill="#2b4d2e"/>
					<path d="M48 30h5v24h-5z" fill="#2b4d2e" opacity=".3"/>
					<path d="M3 54h58" stroke="#c9a13c" stroke-width="3" stroke-linecap="round"/>
				</svg>
				<span>
					<span class="brand-name">Andresen Scholarships</span>
					<span class="brand-sub">Board Dashboard &middot; 2027 Season</span>
				</span>
			</a>
			<nav>
				<a href="index.html">View Site</a>
				<a href="#" id="logout-link" style="display:none">Log Out</a>
			</nav>
		</div>
	</header>

	<main id="main" tabindex="-1" class="admin-main">
		<div class="wrap">

			<!-- Login -->
			<div id="login-view" style="display:none">
				<div class="card login-card">
					<h2>Board Sign-in</h2>
					<p class="hint">Enter the board password to review applications.</p>
					<div id="login-message" class="form-message" role="alert"></div>
					<form id="login-form" class="app-form">
						<div class="field">
							<label for="admin-password">Password</label>
							<div class="pw-wrap">
								<input type="password" id="admin-password" autocomplete="current-password" required>
								<button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password" aria-pressed="false">Show</button>
							</div>
						</div>
						<footer class="controls" style="text-align:center">
							<button type="submit" class="btn" id="login-btn" style="width:100%">Log In</button>
						</footer>
					</form>
				</div>
			</div>

			<!-- List -->
			<div id="list-view" style="display:none">

				<div class="stat-row" id="stat-row"></div>

				<div class="toolbar">
					<input type="search" id="filter-search" placeholder="Search name, school, college, major…" aria-label="Search applications">
					<select id="filter-scholarship" aria-label="Filter by scholarship">
						<option value="">All scholarships</option>
						<option value="ag">Ag</option>
						<option value="memorial">Memorial</option>
					</select>
					<select id="filter-status" aria-label="Filter by status">
						<option value="">All statuses</option>
						<option value="submitted">New</option>
						<option value="in_review">In review</option>
						<option value="awarded">Awarded</option>
						<option value="not_awarded">Not awarded</option>
					</select>
					<select id="filter-rec" aria-label="Filter by recommendation">
						<option value="">Any recommendation</option>
						<option value="submitted">Received</option>
						<option value="pending">Awaiting teacher</option>
					</select>
					<span class="spacer"></span>
					<a href="/api/admin/export" class="btn ghost small" download>Export CSV</a>
				</div>

				<div class="table-card">
					<table class="admin-table">
						<thead>
							<tr>
								<th class="sortable" data-sort="full_name">Applicant</th>
								<th class="sortable" data-sort="high_school">School</th>
								<th>Scholarship</th>
								<th class="sortable" data-sort="gpa">GPA</th>
								<th class="sortable" data-sort="created_at">Submitted</th>
								<th>Recommendation</th>
								<th>Status</th>
								<th class="sortable" data-sort="score">Score</th>
							</tr>
						</thead>
						<tbody id="list-body"></tbody>
					</table>
					<p id="list-empty" style="display:none;padding:1.5rem;text-align:center;color:var(--ink-faint)">No applications match.</p>
				</div>
				<p class="list-foot" id="list-summary"></p>
			</div>

			<!-- Detail -->
			<div id="detail-view" style="display:none">
				<p class="back-link"><a href="#" id="back-link">&larr; Back to all applications</a></p>
				<div id="detail-content"></div>
			</div>

		</div>
	</main>

	<script src="assets/js/admin.js"></script>
</body>

</html>
