# Cloudflare Pages configuration for the Andresen Scholarships site + application backend.
# The static site (index.html, assets/, etc.) is served from the repo root; the
# functions/ directory is deployed automatically as Pages Functions.
name = "andresen-scholarships"
compatibility_date = "2025-01-15"
pages_build_output_dir = "."

# --- D1 (SQLite) database: stores application + recommendation records ---
[[d1_databases]]
binding = "DB"
database_name = "andresen-scholarships"
database_id = "59a0cf2f-e3d9-4860-b8a3-7fb4ca9c8589"

# --- R2 bucket: stores uploaded files (transcripts, essays, signatures, recs) ---
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "andresen-scholarship-uploads"

# --- Non-secret PRODUCTION config (edit per season). ---
# These apply to the live site. For local testing, .dev.vars overrides them
# (keeps localhost URLs + demo email mode). Secrets & board emails live in the
# Cloudflare dashboard, never committed here.
[vars]
APP_BASE_URL = "https://andresen-scholarships.org"
# Open for preview testing. IMPORTANT: set back to "false" before merging to the
# production branch for the public launch, until the 2027 season actually opens.
APPLICATIONS_OPEN = "true"
DEADLINE = "Saturday, March 13, 2027"
RESEND_FROM = "Andresen Scholarships <scholarships@andresen-scholarships.org>"
# BOARD_EMAILS is NOT listed here on purpose. It's set as a dashboard *secret*
# (per environment) to keep the trustees' addresses out of the repo. Don't add it
# back as an empty [vars] entry — for Pages projects this file wins over dashboard
# plaintext vars, so an empty value here would silently blank out the recipients.
# "false" = send real emails via Resend. If no RESEND_API_KEY is set yet, the code
# safely falls back to logging instead of sending, so this is safe to leave false.
DEMO_MODE = "false"

# --- PREVIEW config (branch deploys, *.pages.dev). ---
# Only reason this block exists: APP_BASE_URL. Without it, an application submitted
# on a preview branch sends emails whose "submit your recommendation" and "board
# dashboard" links point at the LIVE site. They happen to work (preview and
# production share one D1 database), but you'd never actually be testing the
# preview's own pages.
#
# NOTE: NOTHING is merged between environments — not vars and not bindings. This
# block fully replaces the config above for preview deploys, so every key has to be
# repeated here even when the value is identical. Adding a var or a binding above
# means adding it here too, or preview silently loses it.
#
# This bit them once already: adding [env.preview.vars] without the d1/r2 bindings
# below stripped DB and UPLOADS from preview, and every admin API call 500'd while
# the page shell still rendered fine — so it looked like a blank dashboard, not an
# error. If preview breaks right after a wrangler.toml edit, check here first.
#
# APP_BASE_URL below is the *branch alias* for redesign-2027. If you test from a
# differently-named branch, update it or the links will point at the wrong preview.

[[env.preview.d1_databases]]
binding = "DB"
database_name = "andresen-scholarships"
database_id = "59a0cf2f-e3d9-4860-b8a3-7fb4ca9c8589"

[[env.preview.r2_buckets]]
binding = "UPLOADS"
bucket_name = "andresen-scholarship-uploads"

[env.preview.vars]
APP_BASE_URL = "https://redesign-2027.scholarship-website.pages.dev"
APPLICATIONS_OPEN = "true"
DEADLINE = "Saturday, March 13, 2027"
RESEND_FROM = "Andresen Scholarships <scholarships@andresen-scholarships.org>"
DEMO_MODE = "false"
