<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Barn & silo. Same mark as every page's header, but kept inside a filled
       rounded square: a browser tab strip can be light or dark, so the favicon
       has to carry its own background. Scaled down to sit inside the padding. -->
